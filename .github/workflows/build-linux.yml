name: Build Linux Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 0.4.0)'
        required: true
        default: '0.4.0'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: crates/dscode-desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          rustflags: ''

      - name: Install frontend dependencies
        run: npm ci
        working-directory: crates/dscode-desktop/ui

      - name: Install tauri-cli (prebuilt binary)
        run: npm install -g @tauri-apps/cli@^2

      - name: Build Tauri (Linux deb)
        run: tauri build --bundles deb

      - name: Upload deb to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ inputs.version }}
          files: target/release/bundle/deb/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
