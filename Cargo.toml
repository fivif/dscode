[workspace]
resolver = "2"
members = [
    "crates/dscode-core",
    "crates/dscode-cli",
    "crates/dscode-tui",
    "crates/dscode-desktop",
    "crates/dscode-server",
    "crates/dscode-web",
]

[workspace.package]
version = "0.4.1"
edition = "2021"
license = "MIT"
authors = ["ZAY"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# Config
# `toml_edit` backs the comment/unknown-key preserving config overlay
# (`dscode-core/src/config/patch.rs`). `toml` is built on top of it, but does not
# re-export the editing API, so this is a direct dependency rather than a
# transitive one. Kept in step with the version `toml` itself resolves to.
toml = "0.8"
toml_edit = "0.20"
# HTTP client
reqwest = { version = "0.12", features = ["json", "stream"] }
# SQLite
rusqlite = { version = "0.31", features = ["bundled", "vtab"] }
# UUID
uuid = { version = "1", features = ["v4"] }
# Time
chrono = { version = "0.4", features = ["serde"] }
# Async trait
async-trait = "0.1"
# Logging
tracing = "0.1"
tracing-subscriber = "0.3"
# Error handling
thiserror = "2"
anyhow = "1"
# Streaming
futures = "0.3"
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
# Regex
regex = "1"
# Text encoding (Windows console output is CP936/GBK on Chinese systems, not UTF-8)
encoding_rs = "0.8"
# Random
rand = "0.8"
# Base64
base64 = "0.22"
# TUI
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
